name: CI - Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # il2cpp_v31 and il2cpp_v39 are mutually exclusive (exactly one must be
    # enabled - see the compile_error!s in src/global_metadata.rs), so they
    # can't both be covered by a single `--all-features` run. Run the suite
    # once per version instead.
    strategy:
      fail-fast: false
      matrix:
        il2cpp_version: [il2cpp_v31, il2cpp_v39]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          default: true

      - name: Run cargo tests (${{ matrix.il2cpp_version }})
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo test --features ${{ matrix.il2cpp_version }} -- --nocapture
